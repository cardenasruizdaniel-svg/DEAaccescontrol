services:
  - type: web
    name: dla-backend
    env: python
    region: ohio
    plan: starter
    buildCommand: pip install -e ".[prod]"
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dla-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dla-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://dla-frontend.onrender.com","https://dla-pwa.onrender.com"]'
      - key: RABBITMQ_URL
        value: ""
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: dla-frontend
    env: node
    region: ohio
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: dla-backend
          type: web
          property: host
        value: /api/v1

  - type: web
    name: dla-pwa
    env: static
    region: ohio
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: dla-backend
          type: web
          property: host
        value: /api/v1

databases:
  - name: dla-db
    plan: starter
    databaseName: dla_access
    region: ohio

redis:
  - name: dla-redis
    plan: starter
    region: ohio
