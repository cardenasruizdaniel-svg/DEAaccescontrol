services:
  - type: web
    name: dla-access-backend
    env: python
    rootDir: backend
    region: oregon
    plan: starter
    buildCommand: pip install -e ".[prod]"
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "DLA Access Enterprise"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dla-access-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dla-access-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://dla-access-frontend.onrender.com","https://dla-access-pwa.onrender.com"]'
      - key: RABBITMQ_URL
        value: ""
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: dla-access-frontend
    env: node
    rootDir: frontend
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: dla-access-backend
          type: web
          property: host

  - type: web
    name: dla-access-pwa
    env: static
    rootDir: pwa
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: dla-access-backend
          type: web
          property: host

  - type: redis
    name: dla-access-redis
    region: oregon
    plan: free
    ipAllowList: []

databases:
  - name: dla-access-db
    plan: starter
    databaseName: dla_access_enterprise
    user: dla
    region: oregon
